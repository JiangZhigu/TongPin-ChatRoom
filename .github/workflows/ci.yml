name: Three-platform validation
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.27'
          enable-cache: false
      - name: Install the locked project and build
        run: python scripts/deploy.py install --dev --build
      - name: Static checks
        run: |
          uv run --no-sync ruff check src scripts tests
          npm run check --workspace @tongpin/web
      - name: Platform HTTP, WebSocket, SQLite, cache, recovery and deployment checks
        run: uv run --no-sync pytest tests/test_infrastructure.py tests/test_m1_transport.py tests/test_m1_live.py tests/test_chat_live.py tests/test_files_live.py tests/test_task_recovery.py tests/test_deployment.py -q
      - name: Frontend tests
        run: npm run test --workspace @tongpin/web
      - name: Browser runtime
        run: npx --no-install playwright install --with-deps chromium
      - name: Real browser smoke
        run: uv run --no-sync python scripts/ci_browser_smoke.py
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and check container entry
        run: |
          docker build -t tongpin-ci .
          docker run --rm tongpin-ci doctor
          docker run --rm --entrypoint /app/.venv/bin/python tongpin-ci -m tongpin --version
      - name: Real container HTTP and WebSocket on persistent storage
        run: |
          mkdir -p "$RUNNER_TEMP/tongpin-persistent"
          sudo chown 10001:10001 "$RUNNER_TEMP/tongpin-persistent"
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=64m --mount "type=bind,src=$RUNNER_TEMP/tongpin-persistent,dst=/persistent" --entrypoint /app/.venv/bin/python tongpin-ci /app/scripts/ci_browser_smoke.py --wire-only --work-dir /persistent/ci-smoke
