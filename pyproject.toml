[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tongpin-chatroom"
version = "0.1.0"
description = "TongPin ChatRoom backend"
requires-python = "==3.12.13"
dependencies = [
  "Flask>=3.1,<3.2",
  "python-socketio>=5.16,<5.17",
  "python-engineio>=4.13.2,<4.14",
  "asgiref>=3.12,<3.13",
  "uvicorn>=0.52,<0.53",
  "websockets>=17,<18",
  "cachetools>=7.1,<8",
  "portalocker>=4.3,<5",
  "argon2-cffi>=25,<26",
  "Pillow>=12.3,<13",
  "pydantic>=2.13,<3",
  "pyotp>=2,<3",
  "cryptography>=44,<48",
  "qrcode[pil]>=8,<9",
  "psutil>=7,<8",
  "tzdata>=2026.1,<2027",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "httpx>=0.28,<1",
  "aiohttp>=3.13,<4",
  "ruff>=0.14,<1",
  "pip-audit>=2.9,<3",
  "websocket-client>=1.8,<2",
  "jsonschema>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tongpin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
